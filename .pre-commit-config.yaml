# =============================================================================
# Pre-commit hooks for Rust projects
# =============================================================================
# Install: pre-commit install
# Run manually: pre-commit run --all-files
#
# Hooks:
#   1. rustfmt-check: verify formatting (fails when unformatted)
#   2. clippy: verify linting (fails on warnings)
#   3. actionlint: validate GitHub Actions workflows
#   4. zizmor: audit GitHub Actions workflows for security issues
#   5. trailing-whitespace / end-of-file-fixer / check-yaml / check-added-large-files
#
# Usage:
#   - pre-commit run --all-files  # verify everything
#   - cargo fmt --all             # format before committing
#   - git commit                  # commit (runs hooks)
# =============================================================================

repos:
  # =============================================================================
  # Rust hooks
  # =============================================================================

  - repo: local
    hooks:
      # Check formatting (does not modify files)
      - id: rustfmt-check
        name: rustfmt (check)
        description: Check Rust code format
        entry: cargo
        args: ["fmt", "--all", "--", "--check"]
        language: system
        pass_filenames: false
        types: [rust]
        exclude: "^target/"

      # Lint (fails on warnings)
      - id: clippy
        name: clippy
        description: Lint Rust code
        entry: cargo
        args: ["clippy", "--all-targets", "--all-features", "--", "-D", "warnings", "-W", "clippy::cognitive_complexity", "-W", "clippy::too_many_lines"]
        language: system
        pass_filenames: false
        types: [rust]
        exclude: "^target/"

      # Validate GitHub Actions workflows (catches semantic errors that
      # check-yaml misses, e.g. nested steps inside a `run: |` block).
      # Requires shellcheck in PATH (installed by mise) for `run:` blocks.
      # The -ignore entries are pre-existing style debt (SC2086 etc.);
      # never ignore structural codes such as SC2215.
      # Keep in sync with the "Lint GitHub Actions workflows" step in ci.yml.
      - id: actionlint
        name: actionlint
        description: Lint GitHub Actions workflows
        entry: actionlint
        args:
          - -ignore
          - "SC2010"
          - -ignore
          - "SC2012"
          - -ignore
          - "SC2027"
          - -ignore
          - "SC2034"
          - -ignore
          - "SC2046"
          - -ignore
          - "SC2086"
          - -ignore
          - "SC2126"
          - -ignore
          - "SC2129"
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false

      # Static security audit of GitHub Actions (zizmor).
      # Detects template injection, unintended credential persistence
      # and excessive permissions.
      - id: zizmor
        name: zizmor (security audit)
        description: Security audit GitHub Actions workflows
        entry: zizmor
        args: ["--config", ".github/zizmor.yml", "--min-severity", "high", ".github/workflows"]
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false

  # =============================================================================
  # Universal hooks
  # =============================================================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        description: Trim trailing whitespace
        name: Trim trailing whitespace
        types: [rust]

      - id: end-of-file-fixer
        description: Ensure files end with newline
        name: Fix end of files
        types: [rust]

      - id: check-yaml
        description: Check YAML syntax
        name: Check YAML

      - id: check-added-large-files
        description: Prevent large files
        args: ["--maxkb=500"]
        name: Check for large files

# =============================================================================
# Global configuration
# =============================================================================
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
