# release-plz configuration — https://release-plz.dev/docs/config
#
# Distribution model: binaries-only via GitHub Releases. The existing
# .github/workflows/release.yml (trigger: `v*` tags) remains the sole
# writer of GitHub Releases with binaries + SHA256SUMS.
#
# release-plz owns: version bump, CHANGELOG, Release PR, git tag.
# release.yml owns: binary builds and the GitHub Release page.

[workspace]
# Version detection from git tags (vX.Y.Z), not from a cargo registry.
# This repo does not publish to crates.io.
git_only = true

# Refuse a dirty tree: it means something is genuinely wrong, and #1197
# showed that allowing it commits that junk straight into the Release PR.
# The tracked-but-gitignored files that forced allow_dirty in #1188 were
# untracked in #1200, so the checkout is clean again.
allow_dirty = false

# Which commits may cut a version. Without this key release-plz bumps on EVERY
# commit (the official default: "release-plz updates the package on every
# commit"), so a `test:`, `ci:`, `docs:` or plain `refactor:` commit publishes a
# tag, a GitHub Release with binaries and a support-line entry for a change no
# user can observe. Measured: v7.7.2 was proposed for the single `test:` commit
# #2782.
#
# Rule: these types always release; ANY type releases when it is breaking
# (`!`, with or without scope). The second branch is deliberately generic — the
# repo's convention puts the canonical `!` in the squash subject (AGENTS.md,
# "Breaking change"), and breaking refactors are real here
# (`refactor(exporter)!:` #2391 -> v7.0.0, `refactor(cli)!:` #2145 -> v5.0.0).
#
# `chore(deps)` is in the first branch on purpose: a dependency bump changes the
# binary, and for a binaries-only product the user cannot rebuild. The repo has
# shipped RUSTSEC fixes under `chore(deps):` (rustix, pulldown-cmark, lru).
#
# Pinned by scripts/test_release_commits_regex.sh, which READS this string and
# runs a table against it: nothing compiles a regex in TOML.
release_commits = '^(feat|fix|perf|revert|chore\(deps\))(\([^)]+\))?!?:|^[a-z]+(\([^)]+\))?!:'

# All packages move in lockstep under one tag: `v2.0.1`, not `webfang-v2.0.1`,
# so the tag matches release.yml's `v*` trigger.
git_tag_enable = true
git_tag_name = "v{{ version }}"

# Per-package `{{package}}-v{{version}}` GitHub releases would fragment the
# release page. One release per version is generated on merge instead.
git_release_enable = false

# Changelog: single workspace-level file, Keep a Changelog sections.
# The first automated update runs against the 2.0.0 baseline cut in #1176.

# Release PR must pass pr-validation.yml unchanged:
# - `chore/release-...` matches the conventional branch regex
# - `type:chore` is the single type:* label (pr-validation requires exactly one)
# - `Closes part of #1177` passes the linked-issue check without auto-closing
#   the tracker (auto-close requires strict adjacency).
pr_branch_prefix = "chore/release-"
pr_labels = ["release", "type:chore"]
pr_body = """\
## Release PR (automated)\n\
Closes part of #1177\n\n\
This PR updates the workspace version and CHANGELOG.md based on the commits \
merged since the last `v*` tag. On merge, the release-plz workflow pushes \
the new `v*` tag, which triggers release.yml to build binaries and publish \
the GitHub Release.\n\n\
Edit CHANGELOG.md here if any entry needs polish before merging — this is \
the single-write consolidation point for the release.\n\
"""

# Changelog rendering is fully delegated to cliff.toml (git-cliff format).
changelog_config = "cliff.toml"

# Single root CHANGELOG.md for the whole product (official pattern:
# https://release-plz.dev/docs/extra/single-changelog). Off by default so
# release-plz does not write one file per crate; webfang_cli owns the root
# file and pulls in the other packages' commits (see [[package]] below).
changelog_update = false

# No registry publishing anywhere.
publish = false
semver_check = false
repo_url = "https://github.com/XaviCodeDev1000/webfang"

# Internal-only crates: never processed by release-plz.
[[package]]
name = "webfang_benchmark"
release = false

[[package]]
name = "webfang_test_utils"
release = false

# Lockstep group: every processed package gets the same next version
# (the highest among the group's next versions), tagged once as `v{{ version }}`.
[[package]]
name = "webfang_cli"
version_group = "webfang"
# The product changelog: one file at the repo root, fed by every crate's
# commits so a release reads as one chronological story (lockstep version).
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = ["webfang_core", "webfang_mcp"]

[[package]]
name = "webfang_core"
version_group = "webfang"

[[package]]
name = "webfang_mcp"
version_group = "webfang"
