# Release Pipeline — Automated binary builds on version tags
#
# Triggers when a tag like v1.2.0 is pushed.
# Builds for Linux (x86_64, aarch64), macOS (aarch64), Windows (x86_64).
# Creates a GitHub Release with all binaries attached.
#
# L1 Provenance Invariant:
#   TAG^{commit} == EXPECTED_SHA == COMMIT_VALIDATED == COMMIT_BUILT == COMMIT_PUBLISHED
# Enforced by check_release_provenance.sh at preflight (L1.1–L1.3), build checkout
# (L1.1 re-asserted via validated_commit output), and publish (L1.4 TOCTOU).
# Tag protection ruleset (L1.5) verified by ruleset subcommand.
#
# Authenticity Invariant (issue #1607, SC-02/SC-04/SC-05/SC-15/SC-16/SC-17):
#   Every published asset is covered by a REAL SLSA provenance attestation
#   (`attest`) and a KEYLESS cosign signature (`sign`), and `publish` REFUSES to
#   create the release unless every one of those signatures verifies against a
#   pinned certificate identity before `gh release create` runs. The provenance
#   table in the release notes is NOT the attestation — it documents the L1
#   invariant above; the attestations live in the GitHub attestations API and in
#   the `.sigstore.json` bundles published next to each asset.
#
# Job graph (each job holds the minimum permission its own steps need):
#   preflight ──> build (matrix) ──> checksums ──> attest ──> sign ──┐
#                        │                                            ├──> publish
#                        └──> mcp-smoke ───────────────────────────────┘
# `attest` needs `build` for the archives and `checksums` for the manifest;
# `sign` needs `attest` so the SBOM and the notice bundle — produced there — are
# signed too; `publish` needs `sign` so it has the bundles to verify, and
# `mcp-smoke` so a binary that cannot answer `tools/list` never becomes a release.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.2.0)"
        required: true
        type: string
      expected_sha:
        description: "Expected commit SHA the tag must resolve to (required for default-branch dispatch)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_LTO: "fat"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"

  # The canonical inventory of every asset a finished release MUST carry: the
  # build matrix (12 archives — the CLI, webfang-mcp and webfang-mcp-stdio, one
  # binary per archive, 4 targets each), the checksums manifest, the SBOM and
  # the notices bundle. The sign/verify/publish steps each check it explicitly before they
  # trust a glob-derived list — every `ls -1` output here is a list of what
  # EXISTS, so an asset that failed to build or download vanishes from the
  # checklist instead of failing it (audit B7: a release without
  # webfang.spdx.json signed, verified and published green).
  # Keep in sync with EXPECTED_ASSETS in scripts/ensure-release.sh — the
  # completeness probe must require exactly this set (the wiring harness in
  # scripts/test_release_reconcile.sh diffs both lists).
  RELEASE_EXPECTED_ASSETS: |
    webfang-x86_64-unknown-linux-gnu.tar.gz
    webfang-aarch64-unknown-linux-gnu.tar.gz
    webfang-aarch64-apple-darwin.tar.gz
    webfang-x86_64-pc-windows-msvc.zip
    webfang-mcp-x86_64-unknown-linux-gnu.tar.gz
    webfang-mcp-aarch64-unknown-linux-gnu.tar.gz
    webfang-mcp-aarch64-apple-darwin.tar.gz
    webfang-mcp-x86_64-pc-windows-msvc.zip
    webfang-mcp-stdio-x86_64-unknown-linux-gnu.tar.gz
    webfang-mcp-stdio-aarch64-unknown-linux-gnu.tar.gz
    webfang-mcp-stdio-aarch64-apple-darwin.tar.gz
    webfang-mcp-stdio-x86_64-pc-windows-msvc.zip
    SHA256SUMS.txt
    webfang.spdx.json
    THIRD_PARTY_NOTICES.txt

# All `run:` steps execute in bash on every OS. Without this, GitHub runs
# Windows steps in pwsh by default (docs: workflow-syntax#shell), and every
# bash-idiom step on the Windows path (Derive SOURCE_DATE_EPOCH, deterministic
# zip, reproducibility assert) dies there — this silently blocked all binary
# publishing from v2.4.2 on. Git Bash ships on windows-latest, so `bash`
# always resolves (same docs table).
defaults:
  run:
    shell: bash

jobs:
  # ============================================================================
  # PREFLIGHT: L1 Provenance Gate + Release Channel + Version Match
  # ============================================================================
  # Runs check_release_provenance.sh preflight which enforces:
  #   L1.1 Identity — tag resolves to EXPECTED_SHA (push: github.sha;
  #       workflow_dispatch default branch: expected_sha input;
  #       workflow_dispatch pinned tag: github.sha + assert ref=tag)
  #   L1.2 Version — tag version == root Cargo.toml version
  #   L1.3 Lineage — EXPECTED_SHA is ancestor of main (derived, not supplied)
  #   L1.5 Ruleset — tag protection ruleset is active and correct
  # Outputs validated_commit, expected_line, tag, prerelease for downstream jobs.
  # ============================================================================
  preflight:
    name: L1 Provenance Preflight
    permissions:
      # GITHUB_TOKEN has no `administration` scope (docs.github.com workflow-syntax
      # #permissions table; actionlint rejects it). Ruleset reads are
      # Metadata-classified, so the L1.5 step with GITHUB_TOKEN runs fail-closed
      # (non-200/403/404 → exit 2 block, never silent pass). Positive read
      # optionally via RULESET_READER_TOKEN secret (fine-grained PAT,
      # Metadata:read) — optional, no secret wiring added here.
      contents: read
    runs-on: ubuntu-latest
    outputs:
      validated_commit: ${{ steps.prov.outputs.validated_commit }}
      expected_line: ${{ steps.prov.outputs.expected_line }}
      tag: ${{ steps.prov.outputs.tag }}
      prerelease: ${{ steps.prov.outputs.prerelease }}
    steps:
      # Full history + tags required so release-plz-tags.sh --tag and
      # git merge-base can resolve the tag and its lineage server-side agreement.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: L1 Provenance Preflight
        id: prov
        env:
          # gh (used by L1.1 tag resolution) requires an explicit token — runners
          # have no ambient gh auth. Same pattern as cut-patch-tag.yml / pr-validation.
          GH_TOKEN: ${{ github.token }}
          PROV_EVENT_NAME: ${{ github.event_name }}
          PROV_EVENT_SHA: ${{ github.sha }}
          PROV_REF: ${{ github.ref }}
          PROV_REF_TYPE: ${{ github.ref_type }}
          PROV_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PROV_EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROV_LINE_REF: origin/main
        run: |
          set -euo pipefail
          bash scripts/check_release_provenance.sh preflight
      # L1.5 Ruleset AFTER the prov step: verifies the tag protection ruleset
      # (release-tags-immutable: update + deletion blocked) is active and correct.
      # Exit 0 = protected, 1 = not protected, 2 = cannot tell (API failure or a
      # token without administration:read). Both non-zero exits block the release
      # (fail-closed) — exit 2 MUST stay blocking, otherwise a token that could
      # never read the ruleset would certify protection it never verified.
      - name: L1.5 Tag Ruleset Check
        env:
          # apply-tag-ruleset.sh check runs gh api — needs the same explicit
          # token as the prov step above; without it the API call fails and the
          # gate blocks with exit 2 (cannot tell), never a silent pass.
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/check_release_provenance.sh ruleset

  # ============================================================================
  # BUILD: Cross-compile for all platforms at the VALIDATED commit
  # ============================================================================
  build:
    needs: [preflight]
    name: Build ${{ matrix.target }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          # x86_64-apple-darwin is NOT in this matrix: the published targets are
          # Linux x86_64/aarch64, macOS Apple Silicon and Windows x86_64.
          # macOS 26 (Tahoe) is also Apple's last Intel release.
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      # Checkout the VALIDATED commit from preflight, not the tag ref.
      # This re-asserts L1.1: the build commit must equal the validated commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.validated_commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          # `toolchain:` is required here, not decorative (#2475). The rev is
          # one that exposes the input, and scripts/check_toolchain_drift.sh
          # fails any step that installs `targets:` without it. The version
          # used to live only inside the action's own action.yml, invisible to
          # grep, which is how v7.0.0 lost its aarch64 build: the target landed
          # on 1.88.0 while rust-toolchain.toml made cargo resolve 1.91.1.
          toolchain: 1.91.1
          targets: ${{ matrix.target }}

      # zizmor: ignore[cache-poisoning] — save-if ensures cache writes ONLY happen on git tags, not manual dispatches.
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # zizmor: ignore[cache-poisoning]
        with:
          key: release-${{ matrix.target }}
          # Tag-only saves: manual workflow_dispatch test runs restore the
          # shared pool but never rewrite it, keeping cache budget for CI.
          save-if: ${{ github.ref_type == 'tag' }}

      # Cross-compilation setup for Linux aarch64
      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          # CARGO_TARGET_*_LINKER only picks the Rust linker. btls-sys configures
          # CMake's C/C++ compilers exclusively from CC_<target> / CXX_<target>
          # (build/config.rs: cc = target_only_var("CC"); build/main.rs defines
          # CMAKE_C_COMPILER only when that var is present). Without them CMake
          # builds BoringSSL for the HOST and the cross link dies with
          # "Relocations in generic ELF (EM: 62) ... file in wrong format".
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            # Host `strip` cannot parse an aarch64 ELF (release run
            # 33976276171: "Unable to recognise the format of the input
            # file"). The target-prefixed binutils ship with the
            # already-installed gcc-aarch64-linux-gnu package.
            echo "STRIP=aarch64-linux-gnu-strip"
          } >> "$GITHUB_ENV"

      - name: Build release binary
        # dtolnay/rust-toolchain@1.91.1 (not @stable): the repo pins 1.91.1 via
        # rust-toolchain.toml, which takes precedence over rustup's default
        # toolchain (rustup docs: overrides rank 4 > 5). Installing the cross
        # target on `stable` leaves the pinned toolchain without it ->
        # E0463 "can't find crate for `core`". The @1.91.1 rev installs the
        # target on the SAME toolchain cargo resolves via the toolchain file.
        #
        # DRIFT TRAP: this action rev does not take a `toolchain:` input. The
        # version is hardcoded inside the action's own action.yml, so it is
        # invisible to `grep 1.91.1` in this repo — repointing the SHA is the
        # ONLY way to change it, and every toolchain bump must update it here
        # AND in the attest job below. v7.0.0 shipped nothing because a bump to
        # 1.91.1 (#2310) left this SHA on the 1.88.0 branch.
        # webfang#2428: ONE invocation builds the CLI and both MCP binaries, and
        # that is load-bearing rather than tidy. `webfang_cli`'s `mcp` feature is
        # an EXPLICIT EMPTY MARKER with no edge to `webfang_mcp`, so on its own
        # `--features mcp` produced a binary with zero MCP code in it; and
        # `webfang_mcp`'s default set enables `webfang_core/mcp` while
        # `webfang_cli/mcp` forwards nothing, so a SECOND `-p webfang_mcp` call
        # resolves a different feature set for `webfang_core` and cargo rebuilds
        # it. Measured with `cargo check` (dev, no codegen — the cheapest
        # probe): 17.76 s for the CLI leg, then 11.60 s to rebuild
        # `webfang_core` alone on the MCP leg. Unified here, the feature sets
        # merge and the crate is compiled once per target.
        run: cargo build --release --locked --features "webfang_cli/mcp" --target ${{ matrix.target }} -p webfang_cli -p webfang_mcp --bins

      - name: Strip binaries (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          # STRIP is set to the target-prefixed binutils only in the
          # cross job; native jobs fall back to host `strip`.
          for bin in webfang webfang-mcp webfang-mcp-stdio; do
            ${STRIP:-strip} "target/${{ matrix.target }}/release/$bin"
          done

      # SC-04: reproducibility. SOURCE_DATE_EPOCH is derived from the COMMITTER
      # date of the VALIDATED commit — the one timestamp in this job that is a
      # property of the source rather than of the machine or the clock.
      # Everything downstream that could embed "now" is then pinned to it.
      - name: Derive SOURCE_DATE_EPOCH
        id: epoch
        env:
          VALIDATED_COMMIT: ${{ needs.preflight.outputs.validated_commit }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$VALIDATED_COMMIT")"
          if ! [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]]; then
            echo "::error::no se pudo derivar SOURCE_DATE_EPOCH del commit validado '$VALIDATED_COMMIT'" >&2
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"

      # GNU tar is REQUIRED, not preferred: the normalization flags below are
      # GNU-only, and bsdtar — which is what `tar` is on macOS — accepts some of
      # them with different meanings. Homebrew's gnu-tar is keg-only, so both
      # candidate directories are probed before giving up. A silent bsdtar
      # fallback would produce an archive that LOOKS normalized and is not, so
      # the probe is fail-closed.
      - name: Locate GNU tar
        if: runner.os != 'Windows'
        id: gnutars
        run: |
          set -euo pipefail
          if tar --sort=name --help >/dev/null 2>&1; then
            echo "command=tar" >> "$GITHUB_OUTPUT"
            echo "GNU tar available as 'tar'."
            exit 0
          fi
          if command -v gtar >/dev/null 2>&1 && gtar --sort=name --help >/dev/null 2>&1; then
            echo "command=gtar" >> "$GITHUB_OUTPUT"
            echo "GNU tar available as 'gtar'."
            exit 0
          fi
          if command -v brew >/dev/null 2>&1; then
            PREFIX="$(brew --prefix)"
            for d in "$PREFIX/opt/gnu-tar/libexec/gnubin" "$PREFIX/opt/gnu-tar/bin"; do
              if [ -x "$d/gtar" ] && "$d/gtar" --sort=name --help >/dev/null 2>&1; then
                echo "command=$d/gtar" >> "$GITHUB_OUTPUT"
                echo "GNU tar found keg-only at $d/gtar."
                exit 0
              fi
            done
          fi
          echo "::error::no se encontró GNU tar. En macOS el 'tar' del sistema es bsdtar y no implementa --sort/--mtime/--format=gnu igual que GNU tar; instálalo con 'brew install gnu-tar'. No se continúa con un bsdtar silencioso: produciría un archivo aparentemente normalizado que no lo está." >&2
          exit 1

      # SC-04: normalized tar. --format=gnu (not pax) is load-bearing: the pax
      # format records owner NAMES, atime/ctime and nanosecond mtimes, none of
      # which are properties of the source. --owner=0/--group=0 with
      # --numeric-owner zero the ids, and --sort=name fixes the order so readdir
      # order cannot leak in.
      - name: Compress (Unix, normalized)
        if: runner.os != 'Windows'
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.SOURCE_DATE_EPOCH }}
          TAR: ${{ steps.gnutars.outputs.command }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cd "target/$TARGET/release"
          # `| gzip -n -9`, not `tar -czf`. Measured: `tar -czf` is already
          # clock-free (GNU gzip writes MTIME=0 when it reads a pipe), so -n is
          # not about the clock — it guarantees the ORIGINAL FILE NAME is never
          # recorded, and -9 makes the compression level explicit instead of
          # leaving it to whichever default the runner image's gzip ships.
          #
          # ONE BINARY PER ARCHIVE (webfang#2428): scripts/check_archive_
          # reproducibility.sh asserts that an archive holds EXACTLY ONE regular
          # file entry, and that invariant is what makes the asserted container
          # properties (uid/gid, owner names, mtime, entry order) legible in the
          # first place. The MCP binaries therefore get their own archives
          # instead of riding along inside the CLI one.
          for pair in \
            "webfang:webfang-$TARGET" \
            "webfang-mcp:webfang-mcp-$TARGET" \
            "webfang-mcp-stdio:webfang-mcp-stdio-$TARGET"; do
            bin="${pair%%:*}"
            asset="${pair##*:}"
            "$TAR" \
              --sort=name \
              --mtime="@$SOURCE_DATE_EPOCH" \
              --owner=0 --group=0 \
              --numeric-owner \
              --format=gnu \
              -cf - "$bin" \
              | gzip -n -9 > "../../../$asset.tar.gz"
          done

      # SC-04: the Windows archive used to be built with `7z`, which is not a
      # pinned input of this repository, is not present on every runner image,
      # and stamps wall-clock time, host uid/gid and host permission bits into
      # every entry. Replaced with a writer whose output is a pure function of
      # its input. The artifact NAME is unchanged — scripts/ensure-release.sh
      # and the release notes both depend on it.
      - name: Compress (Windows, deterministic)
        if: runner.os == 'Windows'
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.SOURCE_DATE_EPOCH }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Same one-binary-per-archive rule as the Unix branch above.
          for pair in \
            "webfang.exe:webfang-$TARGET" \
            "webfang-mcp.exe:webfang-mcp-$TARGET" \
            "webfang-mcp-stdio.exe:webfang-mcp-stdio-$TARGET"; do
            bin="${pair%%:*}"
            asset="${pair##*:}"
            bash scripts/make-deterministic-zip.sh \
              "$asset.zip" \
              "target/$TARGET/release/$bin"
          done

      # Assert the normalization invariants ON the artifact that is about to be
      # published. A regression in the steps above fails the release here rather
      # than shipping an archive nobody can reproduce. See the script header for
      # the honest boundary: this asserts the CONTAINER, not byte-identical
      # rebuilds of the enclosed Windows binary.
      - name: Assert archive reproducibility invariants
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.SOURCE_DATE_EPOCH }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # RUNNER_OS is an env var the runner already exports, so this branch
          # needs no GitHub expression expansion inside a shell block — the same
          # rule the change-scope step was fixed for.
          if [ "$RUNNER_OS" = "Windows" ]; then
            ext=zip
            suffix=.exe
          else
            ext=tar.gz
            suffix=
          fi
          # Every archive this target produces is asserted, not just the CLI
          # one: a normalized CLI archive sitting next to an unnormalized MCP
          # archive would pass a single-file check while shipping the
          # regression it is supposed to catch.
          #
          # --expect-entry is what makes the check about CONTENT, not just
          # shape: three archives now come out of one loop, so a mis-paired
          # (binary -> asset) tuple would otherwise ship a correctly normalized
          # archive holding the wrong executable, with every invariant green.
          bash scripts/check_archive_reproducibility.sh \
            --expect-entry "webfang-$TARGET.$ext=webfang$suffix" \
            --expect-entry "webfang-mcp-$TARGET.$ext=webfang-mcp$suffix" \
            --expect-entry "webfang-mcp-stdio-$TARGET.$ext=webfang-mcp-stdio$suffix" \
            "webfang-$TARGET.$ext" \
            "webfang-mcp-$TARGET.$ext" \
            "webfang-mcp-stdio-$TARGET.$ext"

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: webfang-${{ matrix.target }}
          # `webfang-*<target>.*`, not `webfang-<target>.*`: the MCP archives
          # are named `webfang-mcp-<target>.*`, so the narrower glob would
          # build them and then quietly leave them out of the artifact — the
          # exact "built but never shipped" shape this issue is about.
          path: webfang-*${{ matrix.target }}.*

  # ============================================================================
  # MCP SMOKE: the published artifact must actually answer tools/list
  # ============================================================================
  # webfang#2428 ships webfang-mcp-stdio as a release artifact. "The archive
  # contains a file" is not "the file works": the four build legs prove the
  # former and nothing proved the latter. This drives the EXTRACTED archive over
  # JSON-RPC exactly as a desktop MCP client would, before anything is signed or
  # published.
  #
  # Only the x86_64 Linux artifact is EXECUTED. aarch64 cannot run on an x86_64
  # runner without qemu, and substituting the host build for the published
  # artifact would certify a binary nobody downloads. The aarch64 and Windows
  # MCP binaries are shape-checked only and never run, which is stated here
  # because "smoke tested" must not be read as "all four targets executed".
  mcp-smoke:
    name: Smoke the published MCP binary
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 + fetch-tags: true, exactly like every other checkout in
      # this workflow. scripts/check_release_dispatch.sh asserts that ALL of them
      # carry full history and tags, because the L1 provenance gate needs git
      # merge-base and release-plz-tags.sh --tag. "This job only reads one file,
      # so a shallow clone is enough" is true about THIS job and false about the
      # workflow-level invariant the guard enforces.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.validated_commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download the CLI target's build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: webfang-x86_64-unknown-linux-gnu
          path: smoke

      - name: Extract both MCP archives
        run: |
          set -euo pipefail
          for asset in webfang-mcp webfang-mcp-stdio; do
            tar xzf "smoke/${asset}-x86_64-unknown-linux-gnu.tar.gz" -C smoke
            chmod +x "smoke/${asset}"
          done

      # The HTTP binary is not driven over the wire here — that needs a bound
      # port and an auth decision — but `--version` proves the published
      # artifact EXECUTES. Without this step a binary that cannot start at all
      # still ships, which is the same "built but not working" class the stdio
      # smoke closes for the other binary.
      - name: HTTP binary starts
        run: |
          set -euo pipefail
          timeout 30 smoke/webfang-mcp --version

      - name: Drive tools/list over stdio
        run: |
          set -euo pipefail
          # The script enforces its own per-read deadline, so a server that
          # accepts the pipe and never answers fails on ITS terms rather than
          # hanging the job. `timeout` is the outer belt, not the contract.
          timeout 90 bash scripts/smoke-mcp-stdio.sh smoke/webfang-mcp-stdio

  # ============================================================================
  # CHECKSUMS: Generate SHA256 for all binaries
  # ============================================================================
  checksums:
    name: Generate checksums
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          path: artifacts
          pattern: webfang-*
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum webfang-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: checksums
          path: artifacts/SHA256SUMS.txt

  # ============================================================================
  # ATTEST: real SLSA build provenance + SBOM (SC-16, SC-05)
  # ============================================================================
  # A Markdown table in the release body is not a provenance attestation: anyone
  # who can edit the release body can edit the table, and it attests nothing a
  # consumer can check. `actions/attest-build-provenance` instead mints a signed
  # in-toto statement over each artifact's digest, uploads it to the GitHub
  # attestations API, and a consumer verifies it with `gh attestation verify`
  # without trusting this pipeline at all.
  #
  # `id-token: write` is what makes the attestation keyless: the OIDC token
  # proves *this workflow, at this ref, in this repo* to sigstore, which returns
  # a short-lived certificate. `attestations: write` is the API scope. Nothing
  # else is granted, and `contents: read` exists only for the checkout.
  # ============================================================================
  attest:
    name: Attest provenance + SBOM
    needs: [build, checksums, mcp-smoke, preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # scripts/generate-sbom.sh and scripts/generate-third-party-notices.sh
      # must be the bytes preflight approved (re-asserts L1.1, same reason the
      # build job checks out the validated commit).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.validated_commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # `cargo metadata` needs cargo, and the checked-out rust-toolchain.toml
      # pins 1.91.1. The `toolchain:` input below is what makes this step use
      # that version rather than the rev's `stable` default — the version is
      # named here, not inherited from whichever branch the SHA belongs to.
      # The SBOM is therefore generated by the toolchain that built the
      # artifacts. No target is needed: nothing is compiled here.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.91.1

      # One glob per download step: download-artifact builds a SINGLE Minimatch
      # over the whole `pattern` input, so a multiline pattern matches nothing
      # and the attest below fails with "no statement subjects" (observed on
      # v2.6.4: download "succeeded" with zero artifacts). The archives come
      # from the `build` matrix and SHA256SUMS.txt from the separate
      # `checksums` artifact, hence two steps; the manifest is what
      # `subject-checksums` reads.
      - name: Download build archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          path: artifacts
          pattern: webfang-*
          merge-multiple: true

      - name: Download checksums manifest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          path: artifacts
          pattern: checksums
          merge-multiple: true

      # `attest-build-provenance` also accepts `subject-checksums`, which reads
      # SHA256SUMS.txt and attests EVERY entry it names in one statement. That
      # is strictly better than globbing here: the manifest is the artifact the
      # consumer is told to check first, so attesting it means the manifest
      # itself is covered.
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: artifacts/SHA256SUMS.txt

      - name: Generate SBOM (SPDX 2.3, both lockfiles)
        env:
          # Derived here, from the SAME validated commit the archives were
          # stamped with, rather than threaded through a matrix job's outputs
          # (whose values are last-writer-wins across the four build legs).
          # It makes the SBOM's `creationInfo.created` and
          # `documentNamespace` a property of the commit, so re-running the
          # generator is a no-op diff — which is what makes the signed SBOM
          # meaningful rather than decorative.
          VALIDATED_COMMIT: ${{ needs.preflight.outputs.validated_commit }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$VALIDATED_COMMIT")"
          if ! [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]]; then
            echo "::error::no se pudo derivar SOURCE_DATE_EPOCH del commit validado '$VALIDATED_COMMIT'" >&2
            exit 1
          fi
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          bash scripts/generate-sbom.sh artifacts/webfang.spdx.json

      - name: Generate third-party notices
        run: |
          set -euo pipefail
          bash scripts/generate-third-party-notices.sh artifacts/THIRD_PARTY_NOTICES.txt

      # `actions/attest` is used directly with its `sbom-path` input rather than
      # through `actions/attest-sbom`, because that action is DEPRECATED: its own
      # README states it "is being deprecated in favor of actions/attest" and
      # that "all of the existing action inputs are compatible with the
      # actions/attest interface", and its action.yml is now a thin wrapper that
      # prints `::warning::actions/attest-sbom has been deprecated` and delegates.
      # Pinning a deprecated shim in the pipeline whose whole purpose is
      # attestation integrity would be the wrong trade; the replacement takes
      # the identical `sbom-path` and produces the identical attestation.
      - name: Attest the SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-checksums: artifacts/SHA256SUMS.txt
          sbom-path: artifacts/webfang.spdx.json

      - name: Upload attestable metadata
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: attest-metadata
          # The archives are re-downloaded by `sign` from the build artifacts;
          # only the two files produced HERE travel, so the metadata artifact
          # cannot shadow an archive with a different byte sequence.
          path: |
            artifacts/webfang.spdx.json
            artifacts/THIRD_PARTY_NOTICES.txt

  # ============================================================================
  # SIGN: keyless cosign signature for every published asset (SC-15)
  # ============================================================================
  # KEYLESS, and the reason is concrete rather than stylistic: a long-lived
  # signing key needs a maintainer-held secret that cannot be provisioned from
  # inside this repository, so a key-pair design could not actually be landed.
  # Keyless needs no secret: `id-token: write` proves this workflow at this ref
  # to sigstore, the certificate comes from the GitHub Actions OIDC issuer, and
  # the trust anchor is the public Rekor transparency log.
  #
  # The consequence, stated honestly: the signing identity is a WORKFLOW PATH,
  # not a person, and the `<ref>` in that path is whatever ref the RUN was based
  # on. A tag push signs at
  #   https://github.com/XaviCodeDev1000/webfang/.github/workflows/release.yml@refs/tags/vX.Y.Z
  # and a `workflow_dispatch` from the default branch — the sanctioned backstop
  # and the reconciliation sweep — signs at `@refs/heads/<default-branch>`. Both
  # are legitimate: the workflow file is the same one, and only the run's ref
  # differs.
  #
  # So the boundary is pinned in two parts, and neither is a guess (#2464):
  # `RELEASE_CERT_IDENTITY_REGEXP` states WHICH WORKFLOW FILE, and
  # `RELEASE_CERT_WORKFLOW_REF` / `RELEASE_CERT_WORKFLOW_TRIGGER` state WHICH
  # RUN, as exact equality against the certificate's own OIDC claims. A
  # tag-only identity here is what made the recovery path unable to pass its own
  # check: it signed as a branch and was rejected as not-a-tag, after every
  # build, checksum, attestation and signature had already succeeded.
  #
  # SHA256SUMS.txt is signed like everything else, and that is the SC-15 fix: the
  # manifest is signed by a job that did not produce it, so it is evidence rather
  # than a tautology. `needs: [attest]` also means the SBOM and the notice
  # bundle get signed, so no published asset is left unsigned.
  # ============================================================================
  sign:
    name: Sign every published asset (keyless)
    needs: [attest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download build archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          path: artifacts
          # `actions/download-artifact` builds ONE Minimatch from the whole
          # `pattern` string, so a multiline value matches nothing (observed on
          # v2.6.5: zero archives downloaded here, the sign step survived on
          # the two attest-metadata files and the release shipped binary-less).
          # One glob per step — same split as the `attest` job.
          pattern: webfang-*
          merge-multiple: true

      - name: Download checksums manifest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          path: artifacts
          pattern: checksums
          merge-multiple: true

      - name: Download attestable metadata
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: attest-metadata
          path: artifacts

      # Version-pinned via `cosign-release` so a cosign release cannot change
      # the CLI contract (`sign-blob --bundle`) underneath a pinned action.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - name: Sign every asset
        run: |
          set -euo pipefail
          # Audit B7: verify the REQUIRED inventory explicitly — the glob below
          # reports what exists, so a missing asset has to be caught here and
          # named, not silently absent from the list.
          while IFS= read -r expected; do
            if [[ -z "$expected" ]]; then continue; fi   # trailing-newline tail-safety
            if [[ ! -f "artifacts/$expected" ]]; then
              echo "::error::falta el artefacto requerido artifacts/$expected — una release con inventario incompleto es exactamente el hueco que este paso cierra" >&2
              exit 1
            fi
          done <<<"$RELEASE_EXPECTED_ASSETS"
          # Sorted so the signing order is a property of the file names, not of
          # readdir, and so a partially-signed run is reproducible from the log.
          mapfile -t assets < <(
            cd artifacts
            ls -1 webfang-*.tar.gz webfang-*.zip SHA256SUMS.txt webfang.spdx.json THIRD_PARTY_NOTICES.txt 2>/dev/null \
              | LC_ALL=C sort
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no hay assets que firmar: una release sin firmas es exactamente el defecto que este paso cierra" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            [ -f "artifacts/$asset" ] || { echo "::error::falta artifacts/$asset" >&2; exit 1; }
            cosign sign-blob --yes --bundle "artifacts/$asset.sigstore.json" "artifacts/$asset"
            echo "signed: $asset"
          done
          echo "signed ${#assets[@]} assets"

      - name: Upload assets and signature bundles
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: signed-assets
          path: artifacts/*

  # ============================================================================
  # PUBLISH: L1.4 TOCTOU re-read + VERIFY SIGNATURES + Create GitHub Release
  # ============================================================================
  publish:
    name: L1 Publish + Release
    needs: [build, checksums, mcp-smoke, preflight, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # scripts/check_release_provenance.sh must exist in the workspace —
      # the L1.4 step runs it below. Checkout the VALIDATED commit so the
      # gate bytes are the ones preflight approved (re-asserts L1.1).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.validated_commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download signed assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          path: artifacts
          # ONLY the `sign` job's artifact, not every artifact of the run. That
          # artifact is the single authoritative copy of what gets published —
          # archives, SHA256SUMS.txt, SBOM, notices and every `.sigstore.json`
          # bundle — so verification and publication read the same bytes.
          # Pulling the build artifacts in as well would put two copies of each
          # archive in one directory and make "which one was verified" ambiguous.
          name: signed-assets

      # Version-pinned to the same release as the `sign` job, so a bundle
      # written by one cosign is read by the same one. cosign's bundle format
      # and `verify-blob` flags are the contract here.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      # SC-17: the release VERIFIES a signature before it exists. This step is
      # the difference between a pipeline that signs artifacts and a pipeline
      # that can prove it published the artifacts it signed. It runs BEFORE
      # `gh release create`, and it is fail-closed on every branch: a missing
      # cosign, a missing bundle, an invalid signature, a foreign identity, or
      # an empty asset list all block the release.
      - name: Verify signatures
        env:
          # Stated here, at the point of use, so a reviewer reading this workflow
          # sees the identity that is being trusted. It is the release workflow
          # of this repository — not another workflow, not another repository —
          # and the ref is left as a SHAPE (`refs/heads/...` or `refs/tags/...`)
          # because the run's ref legitimately differs between a tag push and a
          # workflow_dispatch. WHICH run is pinned by the two claims below, as
          # exact equality against the certificate itself, so widening the
          # identity here cannot widen what the gate accepts (#2464).
          RELEASE_CERT_IDENTITY_REGEXP: '^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/(heads|tags)/.+$'
          # The run's own ref and event, asserted against the certificate's OIDC
          # claims. On a tag push: `refs/tags/vX.Y.Z` + `push`. On the backstop
          # dispatch: `refs/heads/<default-branch>` + `workflow_dispatch`. Read
          # from the github context rather than written as a literal, so there is
          # no branch name to rot — and so a bundle produced by a different run
          # cannot be substituted into this one.
          #
          # The tag<->commit binding is NOT this step's job: L1 Provenance
          # Preflight already asserts TAG^{commit} == EXPECTED_SHA ==
          # COMMIT_VALIDATED == COMMIT_BUILT before a single byte is built.
          RELEASE_CERT_WORKFLOW_REF: '${{ github.ref }}'
          RELEASE_CERT_WORKFLOW_TRIGGER: '${{ github.event_name }}'
        run: |
          set -euo pipefail
          # Audit B7: verify the REQUIRED inventory explicitly — the glob that
          # builds the :code list reports what exists, so a missing asset is
          # caught-and-named here, not silently absent from the list.
          while IFS= read -r expected; do
            if [[ -z "$expected" ]]; then continue; fi   # trailing-newline tail-safety
            if [[ ! -f "artifacts/$expected" ]]; then
              echo "::error::falta el artefacto requerido artifacts/$expected — no se verifica una firma de la que nunca se firmó: el conjunto completo debe estar en la lista" >&2
              exit 1
            fi
          done <<<"$RELEASE_EXPECTED_ASSETS"
          mapfile -t assets < <(
            cd artifacts
            ls -1 webfang-*.tar.gz webfang-*.zip SHA256SUMS.txt webfang.spdx.json THIRD_PARTY_NOTICES.txt 2>/dev/null \
              | LC_ALL=C sort
          )
          # Every published asset is verified — not a hand-picked subset. The
          # list is derived from the same glob the release notes and
          # scripts/ensure-release.sh use, so an asset that ships is an asset
          # that was signed and an asset whose signature was checked.
          to_verify=()
          for asset in "${assets[@]}"; do
            to_verify+=("artifacts/$asset")
          done
          bash scripts/verify-release-signatures.sh "${to_verify[@]}"

      # L1.4 TOCTOU re-read: re-resolve the tag server-side and compare
      # against the validated commit from preflight. Any drift blocks.
      - name: L1.4 TOCTOU re-read
        id: prov_publish
        env:
          # gh api inside the publish subcommand needs the explicit token —
          # runners have no ambient gh auth (same class as the preflight fix).
          GH_TOKEN: ${{ github.token }}
          PROV_VALIDATED_COMMIT: ${{ needs.preflight.outputs.validated_commit }}
          PROV_TAG: ${{ needs.preflight.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/check_release_provenance.sh publish

      - name: Create release with provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG_URL: https://github.com/XaviCodeDev1000/webfang/blob/main/CHANGELOG.md
          TAG: ${{ needs.preflight.outputs.tag }}
          VALIDATED_COMMIT: ${{ needs.preflight.outputs.validated_commit }}
          EXPECTED_LINE: ${{ needs.preflight.outputs.expected_line }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          {
            echo "## What's Changed"
            echo ""
            echo "See [CHANGELOG]($CHANGELOG_URL) for details."
            echo ""
            echo "## Installation"
            echo ""
            echo "WebFang ships **binaries only** — nothing is published to crates.io, so \`cargo install webfang\` does not work. Download the archive for your platform from the assets below."
            echo ""
            echo "| Platform | Asset |"
            echo "|----------|-------|"
            echo "| Linux x86_64 | \`webfang-x86_64-unknown-linux-gnu.tar.gz\` |"
            echo "| Linux ARM64 | \`webfang-aarch64-unknown-linux-gnu.tar.gz\` |"
            echo "| macOS Apple Silicon | \`webfang-aarch64-apple-darwin.tar.gz\` |"
            echo "| Windows x86_64 | \`webfang-x86_64-pc-windows-msvc.zip\` |"
            echo ""
            echo "**Each platform also ships the MCP servers**, one binary per archive: \`webfang-mcp-<target>\` (Streamable HTTP) and \`webfang-mcp-stdio-<target>\` (stdio, for desktop clients that spawn the server). Both expose the same 36 tools. Install notes: <https://github.com/XaviCodeDev1000/webfang/blob/main/docs/src/installation.md#mcp-servers-from-the-release-artifact>"
            echo ""
            echo "**There is no Intel macOS artifact** — the published targets are Linux x86_64, Linux ARM64, macOS Apple Silicon and Windows x86_64; Intel macOS is not in the list. Build from source (see the From source section below) if you need an Intel Mac build."
            echo ""
            echo "Every archive holds exactly ONE bare binary (\`webfang.exe\`, \`webfang-mcp.exe\` or \`webfang-mcp-stdio.exe\` on Windows). Nothing installs it for you — extract it, make it executable, and put it on your PATH:"
            echo ""
            echo '```bash'
            echo "# Linux / macOS"
            echo "tar xzf webfang-<target-triple>.tar.gz"
            echo "sudo install -m 0755 webfang /usr/local/bin/webfang   # or, no sudo: install -m 0755 webfang ~/.local/bin/webfang"
            echo "webfang --version"
            echo '```'
            echo ""
            echo '```powershell'
            echo "# Windows"
            printf '%s\n' "New-Item -ItemType Directory -Force -Path \"\$env:USERPROFILE\\bin\" | Out-Null"
            printf '%s\n' "Move-Item -Force webfang.exe \"\$env:USERPROFILE\\bin\\webfang.exe\""
            echo "webfang --version"
            echo '```'
            echo ""
            echo "Platform requirements: **glibc 2.39 or newer** on Linux (the artifacts link glibc directly and there is no musl build), the **Microsoft Visual C++ Redistributable 2015-2022 (x64)** on Windows (MSVC's default dynamic CRT), and on macOS the \`com.apple.quarantine\` flag must be cleared with \`xattr -d com.apple.quarantine webfang\` if Gatekeeper kills the first run."
            echo ""
            echo "### From source"
            echo ""
            echo "Requires Rust 1.91, a C/C++ compiler, and **\`cmake\`**. The HTTP client \`wreq\` → \`btls\` → \`btls-sys\` (formerly \`boring2\`/\`boring-sys2\`) compiles BoringSSL from C++ on first build, and without \`cmake\` the failure surfaces deep inside a build script with an error that never mentions the real cause."
            echo ""
            echo '```bash'
            echo "git clone https://github.com/XaviCodeDev1000/webfang"
            echo "cd webfang"
            echo 'cargo build --release --locked --features "webfang_cli/mcp" -p webfang_cli -p webfang_mcp --bins'
            echo '```'
            echo ""
            echo "## Verification"
            echo ""
            echo "Verify the checksum of the archive you downloaded **before extracting it**. \`SHA256SUMS.txt\` lists all twelve archives. The command differs per platform: \`sha256sum\` is GNU coreutils and exists on neither stock macOS nor PowerShell."
            echo ""
            echo '```bash'
            echo "# Linux"
            echo "sha256sum -c SHA256SUMS.txt --ignore-missing"
            echo ""
            echo "# macOS"
            echo "shasum -a 256 webfang-aarch64-apple-darwin.tar.gz"
            echo "grep aarch64-apple-darwin SHA256SUMS.txt"
            echo '```'
            echo ""
            echo '```powershell'
            echo "# Windows"
            echo "(Get-FileHash webfang-x86_64-pc-windows-msvc.zip -Algorithm SHA256).Hash.ToLower()"
            echo "Select-String -Path SHA256SUMS.txt -Pattern pc-windows-msvc"
            echo '```'
            echo ""
            echo "Full install and uninstall guide, including every on-disk root a run leaves behind: <https://github.com/XaviCodeDev1000/webfang/blob/main/docs/src/installation.md>"
            echo ""
            echo "## Provenance Attestation (L1)"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Tag | \`$TAG\` |"
            echo "| Validated Commit | \`$VALIDATED_COMMIT\` |"
            echo "| Lineage | \`$EXPECTED_LINE\` (ancestor) |"
            echo "| Channel | ${{ needs.preflight.outputs.prerelease == 'true' && 'Release Candidate' || 'Stable' }} |"
            echo "| L1 Gate | \`check_release_provenance.sh preflight | ruleset | publish\` |"
            echo "| Ruleset | \`release-tags-immutable\` (update + deletion blocked) |"
          } > /tmp/release-notes.md
          # The asset list is derived, not transcribed: a hardcoded second copy
          # of the matrix's target names would be free to drift, and a name that
          # exists only in one place is a name that silently stops shipping.
          # `*.sigstore.json` is deliberately NOT in the main list — the bundles
          # are uploaded in the second call below, so the primary asset list
          # never contains a signature for itself. The REQUIRED inventory is
          # then checked explicitly (audit B7): every expected asset must
          # exist before anything is uploaded.
          expected_missing=()
          while IFS= read -r expected; do
            if [[ -z "$expected" ]]; then continue; fi   # trailing-newline tail-safety
            [[ -f "artifacts/$expected" ]] || expected_missing+=("$expected")
          done <<<"$RELEASE_EXPECTED_ASSETS"
          if [ "${#expected_missing[@]}" -gt 0 ]; then
            echo "::error::faltan artefactos requeridos para publicar: ${expected_missing[*]}" >&2
            exit 1
          fi
          mapfile -t assets < <(
            cd artifacts
            ls -1 webfang-*.tar.gz webfang-*.zip SHA256SUMS.txt webfang.spdx.json THIRD_PARTY_NOTICES.txt 2>/dev/null \
              | LC_ALL=C sort
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no hay assets que publicar" >&2
            exit 1
          fi
          upload=()
          for asset in "${assets[@]}"; do
            upload+=("artifacts/$asset")
          done
          # No GitHub expression is expanded into this shell block: the flag
          # arrives as an env var, so the shell decides what to pass, not the
          # expression engine (the same rule the change-scope step follows).
          prerelease_args=()
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$TAG" \
            --title "WebFang $TAG" \
            --notes-file /tmp/release-notes.md \
            "${upload[@]}" \
            "${prerelease_args[@]}"
          # Bundles last, and separately, so the asset list `gh` receives for
          # the release body is exactly the list that was verified above.
          gh release upload "$TAG" artifacts/*.sigstore.json --clobber
