# Configuración de cargo-nextest 2026 - Optimizada para scrapers
# Ubicación recomendada: .config/nextest.toml
# Ver docs: https://nexte.st/book/configuration
#
# Cambios vs nextest.toml anterior:
# - global-timeout: Previene cuelgues infinitos
# - fail-fast = false: Mejor para desarrollo iterativo
# - Estructura optimizada para agentes de código

[profile.default]
# NVMe-aware: run up to 4 tests in parallel by default.
test-threads = 4
threads-required = 1

# Retries con backoff para tests flaky (red, I/O)
retries = { backoff = "exponential", count = 2, delay = "1s" }

# Enforcement de flakiness (#2306, paso 3 de #2305): un test que sólo pasa al
# reintento FALLA el run, en local y en CI (ci hereda de acá). La señal pasiva
# ("flaky" en el resumen final) ya no alcanza. El rollback del enforcement es
# revertir esta línea; los flakes conocidos los caza la lane nocturna (#2286).
flaky-result = "fail"

# Global timeout: Previene cuelgues (30min desarrollo)
global-timeout = "30m"

# No fallar rápido: Mejor feedback durante desarrollo
fail-fast = false

# Output optimizado para agentes
failure-output = "final"
success-output = "final"
status-level = "skip"

# Timeout para tests lentos (scraping, red, disco)
slow-timeout = { period = "60s", terminate-after = 3, grace-period = "10s" }

# Filtros: excluir tests pesados por defecto
default-filter = "not test(ai_integration)"

# El test trybuild de compile-fail no es lento-por-naturaleza como un scrape:
# COMPILA el crate y cada caso de los suites `page_state/` y `batch_manager/`
# (un solo runner: ver #2366). Sin este override el techo que lo
# mata es el `slow-timeout` global de más arriba — 60s x 3 = 180s exactos.
#
# Medido, en frío y sin cache de trybuild: macOS 467.0 s AL PRIMER intento —
# 2.6x el techo viejo de 180 s, que lo mataba dos veces y lo dejaba a un
# tercero de suerte. Local: 176.3 s en frío (97.9% del techo viejo), 67 s con
# el cache tibio.
#
# Windows SIGUE SIN NÚMERO: TERM 3/3 a 180.0 s sin completar nunca. Y 600 s
# queda a sólo 1.28x de lo que tarda macOS, así que si Windows va más lento la
# lane queda roja ahí — este override lo que va a producir ese número.
#
# Override por test y NO global: subir el techo común dejaría de cazar cuelgues
# reales en el resto de la suite. 600s con terminate-after 1, con el mismo
# criterio que el perfil `discovery` más abajo (tests largos, no flaky → un
# solo intento; los reintentos sólo multiplican el global-timeout). El 600s
# está deliberadamente justo por ARRIBA del macOS medido (467s), no holgado
# como el del `discovery`: un techo más ajustado lo dejaría rojo otra vez, y el
# dato de Windows todavía no existe para justificar más. Backstop: el
# `global-timeout` de ESTE perfil (30m), no el del `discovery` (45m).
#
# `test(=...)` es el selector de coincidencia EXACTA. A secas, `test(...)` hace
# substring match: verificado en este repo, `test(illegal_page_transitions)`
# matchea 1 y `test(=illegal_page_transitions)` matchea 0, o sea que la forma
# sin `=` habría aplicado este techo a cualquier test futuro cuyo nombre
# contenga el texto.
[[profile.default.overrides]]
filter = 'test(=compile_fail_cases_fail_to_compile)'
slow-timeout = { period = "600s", terminate-after = 1, grace-period = "30s" }

[profile.ci]
# Hereda de `default` (#2306; inherits existe desde 0.9.115): la política
# compartida — retries con backoff, default-filter, flaky-result y el override
# del trybuild — vive UNA vez en default. Este perfil declara sólo las
# diferencias intencionales de CI: más paralelismo, techos más largos y
# output sobrio para el log.
inherits = "default"
test-threads = 8
failure-output = "immediate-final"

# Timeouts más largos para CI
slow-timeout = { period = "120s", terminate-after = 2, grace-period = "30s" }
global-timeout = "1h"

# Output para CI (#2305, paso 2): el log de CI no necesita el stdout de los
# tests que pasan ni el estado de cada skip; sí necesita los fallos en el
# stream y, al final, el detalle de lentos y flaky ("slow" ya incluye "flaky":
# los niveles de final-status-level son acumulativos y el valor es único —
# "slow,flaky" no es sintaxis válida).
success-output = "never"
status-level = "fail"
final-status-level = "slow"

# Lane nocturna de detección de flakes (#2286; adopción en #2305 paso 4): la
# misma suite que test-full pero con reintentos a cero, para que cada flake
# genuino ponga el job en rojo (report-only vía continue-on-error en ci.yml).
# Hereda de `ci` (#2306): la única diferencia con las lanes de PR es la
# política de reintentos. Con retries = 0 el flaky-result heredado nunca
# dispara (no hay reintento que convierta un fallo en flaky).
[profile.flake-nightly]
inherits = "ci"
retries = 0

# Job `coverage` (ci.yml): informational coverage run. Inherits the ci
# profile's parallelism, timeouts and output, but runs the same test set as the
# former `cargo llvm-cov -- ... --skip test_mcp` (all tests, including
# ai_integration) and treats a retry-passed test as a pass: a flake must not
# turn the coverage report red.
[profile.coverage]
inherits = "ci"
default-filter = "all()"
flaky-result = "pass"

[profile.dev]
# Perfil para desarrollo iterativo (ultra-rápido)
# Ejecuta solo lo afectado → 8-25 segundos típico
# Hereda de `default` (0.9.115+): default-filter, flaky-result, el override
# del trybuild (que su techo de 30s x 2 mataba latente) y el resto no listado.
test-threads = 4
threads-required = 1
fail-fast = false
retries = 1

# Timeouts agresivos para feedback rápido
slow-timeout = { period = "30s", terminate-after = 2, grace-period = "5s" }
global-timeout = "5m"

# Output optimizado para desarrollo
success-output = "immediate"
failure-output = "immediate"
status-level = "skip"

[profile.agent]
# Perfil específico para agentes de código (paralelismo moderado, más timeout)
# Hereda de `default` (0.9.115+): además de default-filter y el override del
# trybuild, GANA los retries de default (antes corría sin reintentos) y su
# flaky-result: un flaky en la corrida de un agente es rojo, no ruido.
test-threads = 4
threads-required = 1
global-timeout = "15m"
fail-fast = false

# Output inmediato para mejor feedback a agentes
success-output = "immediate"
failure-output = "immediate-final"

# Timeouts conservadores para evitar timeouts de agentes
slow-timeout = { period = "45s", terminate-after = 2, grace-period = "5s" }

[profile.discovery]
# Perfil del job `ignored-tests` de Production Bug Discovery (bug-discovery.yml,
# #1510): ejecuta a diario el universo `#[ignore]`. slow-timeout debe superar
# con margen el test ignorado legítimo más pesado hoy (p0_001_engine_parity:
# 82s medidos) — 600s = 10 min por test con terminate-after 1 (sin reintentos
# de tests de medición, que no son flaky sino largos). global-timeout 45m
# cubre la corrida filtrada completa; el job tiene timeout-minutes: 60.
# Hereda de `default` (0.9.115+): default-filter (los ai_integration quedan
# fuera del sweep) y flaky-result=fail — acá un flaky ES un finding, la lane
# existe para reportarlos.
test-threads = 2
threads-required = 1
retries = { backoff = "exponential", count = 2, delay = "1s" }
fail-fast = false
slow-timeout = { period = "600s", terminate-after = 1, grace-period = "30s" }
global-timeout = "45m"
failure-output = "final"
success-output = "final"
status-level = "skip"
