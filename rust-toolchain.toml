# Pin the Rust toolchain so CI and local use the SAME compiler/rustfmt.
# Without this, CI uses rolling `stable` (newer rustfmt) and fails `cargo fmt --all -- --check`
# on code formatted by the locally-installed 1.100 rustfmt.
# Matches rust-version in Cargo.toml (1.100) and AGENTS.md ("Rust 1.100").
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
