# Pin the Rust toolchain so CI and local use the SAME compiler/rustfmt.
# Without this, CI uses rolling `stable` (newer rustfmt) and fails `cargo fmt --all -- --check`
# on code formatted by the locally-installed 1.91 rustfmt.
# Matches rust-version in Cargo.toml (1.91) and AGENTS.md ("Rust 1.91").
[toolchain]
channel = "1.91.1"
components = ["rustfmt", "clippy"]
